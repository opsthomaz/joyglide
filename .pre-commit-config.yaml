# Pre-commit — run linters locally on `git commit` so bad code never lands.
# Mirrors what .github/workflows/lint.yml runs in CI, but on the contributor's
# machine before a push goes anywhere.
#
# To activate:
#   pip install pre-commit
#   pre-commit install
#
# To run on demand on every file:
#   pre-commit run --all-files

repos:
  # Ruff — same lint+format set the CI uses (config in pyproject.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy — same config as CI.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Avoid pulling every transitive dep in pre-commit's isolated env;
        # the CI lint workflow does the deep type check.
        args: [--ignore-missing-imports, --no-error-summary]
        exclude: '^(setup\.py|research/)'

  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
