name: CodeQL

# GitHub's semantic code analysis. Free for public repos, runs on every push
# and on a weekly schedule to catch issues introduced by new dependencies.
# Findings appear under the repo's Security → Code scanning tab, and surface
# inline on PR diffs.
#
# More on rule selection: https://codeql.github.com/codeql-query-help/python/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — picks up newly disclosed CVEs and rule updates
    # without us having to push.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          languages: python
          # security-and-quality includes: security rules + maintainability +
          # reliability + performance. The richer pack vs. just "security".
          queries: security-and-quality
          # research/ is cloned upstream repos (gitignored entirely);
          # packaging/ holds PyInstaller specs and shell wrappers, not
          # application code. Neither should be subject to production-style
          # analysis.
          config: |
            paths-ignore:
              - research
              - packaging

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          category: "/language:python"
